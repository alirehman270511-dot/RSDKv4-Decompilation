name: Build RSDKv4

on:
  push:
    paths:
      - android/**
      - dependencies/**
      - RSDKv4/**
      - platforms/**
      - .github/workflows/build.yml
      - CMakeLists.txt
    branches:
      - main

env:
  GENERAL_FLAGS: "-DRETRO_DISABLE_PLUS=OFF -DCMAKE_BUILD_TYPE=Release"
  # Normally you would use $VCPKG_INSTALLATION_PATH, but it's broken...so hardcode C:/vcpkg
  GENERAL_WIN_FLAGS: "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
  WIN32_FLAGS: "-DVCPKG_TARGET_TRIPLET=x86-windows-static -DCMAKE_PREFIX_PATH=C:/vcpkg/installed/x86-windows-static/ -A Win32"
  WIN64_FLAGS: "-DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_PREFIX_PATH=C:/vcpkg/installed/x64-windows-static/"
  # FIXME: For some reason ubuntu enables _FORTIFY_SOURCE by default, so let's override it to prevent IO bugs
  GENERAL_LINUX_FLAGS: "-DCMAKE_CXX_FLAGS='-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0'"

jobs:
  v4-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: vcpkg install glew sdl2 libogg libvorbis --triplet=x86-windows-static
      - name: Build RSDKv4
        run: |
          cmake -B build ${{env.GENERAL_FLAGS}} ${{env.GENERAL_WIN_FLAGS}} ${{env.WIN32_FLAGS}}
          cmake --build build --parallel --config Release
      - name: Move artifacts
        run: |
          mkdir artifacts
          mv ./build/Release/*.exe ./artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v4-windows
          path: artifacts

  v4-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: vcpkg install glew sdl2 libogg libvorbis --triplet=x64-windows-static
      - name: Build RSDKv4
        run: |
          cmake -B build ${{env.GENERAL_FLAGS}} ${{env.GENERAL_WIN_FLAGS}} ${{env.WIN64_FLAGS}}
          cmake --build build --parallel --config Release
      - name: Move artifacts
        run: |
          mkdir artifacts
          mv ./build/Release/*.exe ./artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v4-windows-x64
          path: artifacts

  v4-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository Android
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download and extract dependencies
        run: |
          mkdir -p dependencies/android
          mkdir -p android/app/jni
          
          curl -L "https://osuosl.org" | tar -xz -C dependencies/android/
          mv dependencies/android/libogg-1.3.5 dependencies/android/libogg
          
          curl -L "https://osuosl.org" | tar -xz -C dependencies/android/
          mv dependencies/android/libvorbis-1.3.7 dependencies/android/libvorbis
          
          curl -L "https://libsdl.org" | tar -xz -C android/app/jni/
          mv android/app/jni/SDL2-2.28.3 android/app/jni/SDL

      - name: Build RSDKv4 Android
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PABIFILTERS="armeabi-v7a;arm64-v8a" \
            -PRETRO_DISABLE_PLUS=OFF
            
      - name: Upload artifact Android
        uses: actions/upload-artifact@v4
        with:
          name: v4-android
          path: ./android/app/build/outputs/apk/release/*.apk
